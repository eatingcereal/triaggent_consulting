<style>
:root { --bg: #eef2f2; --panel: #ffffff; --ink: #0f1d1c; --muted: #687876; --rule: #d8e1e0; --accent: #00716a; --accent-ink: #ffffff; --crit: #d03b3b; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0b1514; --panel: #111e1d; --ink: #e3ecea; --muted: #8b9e9b; --rule: #24403c; --accent: #4fc3b8; --accent-ink: #062320; --crit: #f07070; }
}
:root[data-theme="dark"] { --bg: #0b1514; --panel: #111e1d; --ink: #e3ecea; --muted: #8b9e9b; --rule: #24403c; --accent: #4fc3b8; --accent-ink: #062320; --crit: #f07070; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 16px/1.5 "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
form { width: 100%; max-width: 360px; padding: 28px; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; }
h1 { margin: 0 0 4px; font: 700 22px/1.2 "Archivo", system-ui, sans-serif; }
p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
input { width: 100%; padding: 10px 12px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: 6px; }
input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button { width: 100%; margin-top: 14px; padding: 10px 12px; font: inherit; font-weight: 600; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 6px; cursor: pointer; }
button:disabled { opacity: .6; cursor: progress; }
.err { min-height: 20px; margin: 10px 0 0; color: var(--crit); font-size: 13px; }
</style>

const SAVED = "beyond-wrvus-key";
const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const form = document.getElementById("gate");
const pw = document.getElementById("pw");
const err = document.getElementById("err");
const button = form.querySelector("button");

async function deriveKey(password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(P.salt), iterations: P.iters, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}

// Throws on a wrong key: AES-GCM authentication fails before anything is decompressed.
async function decryptPage(key) {
  const blob = bytes(P.data);
  const zipped = await crypto.subtle.decrypt({ name: "AES-GCM", iv: blob.subarray(0, 12) }, key, blob.subarray(12));
  return new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}

function render(html) {
  document.open();
  document.write(html);
  document.close();
}

// Reloads in the same tab reuse the key instead of asking again.
let saved = null;
try { saved = sessionStorage.getItem(SAVED); } catch {}
if (saved) {
  form.hidden = true;
  try {
    render(await decryptPage(await crypto.subtle.importKey("raw", bytes(saved), "AES-GCM", false, ["decrypt"])));
  } catch {
    try { sessionStorage.removeItem(SAVED); } catch {}
    form.hidden = false;
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!crypto.subtle || typeof DecompressionStream === "undefined") {
    err.textContent = "This browser can't open the page. Try a current version of Chrome, Edge, Firefox, or Safari.";
    return;
  }
  button.disabled = true;
  err.textContent = "";
  try {
    const key = await deriveKey(pw.value);
    const html = await decryptPage(key);
    try {
      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      sessionStorage.setItem(SAVED, btoa(String.fromCharCode(...raw)));
    } catch {}
    render(html);
  } catch {
    err.textContent = "That password isn't right.";
    button.disabled = false;
    pw.select();
  }
});
</script>
